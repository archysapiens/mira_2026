<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso | MIRA</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="loginPage">
  <main class="loginCard">
    <h1>Portal MIRA</h1>
    <p>Ingresa con tu correo electrónico.</p>
    
    <form class="form" id="login">
      <label>
        Correo
        <input id="email" type="email" value="cliente@mira.com" required>
      </label>
      
      <label>
        Contraseña
        <input id="password" type="password" value="123" required>
      </label>
      
      <p id="error" class="error hidden"></p>
      <button class="primary">Iniciar sesión →</button>
    </form>

    <div class="demo">
      <b>Cuentas de demostración</b>
      <button data-email="cliente@mira.com">Cliente · cliente@mira.com</button>
      <button data-email="operador@mira.com">Operador · operador@mira.com</button>
      <button data-email="admin@mira.com">Administrador · admin@mira.com</button>
      <small>Contraseña: 123</small>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
